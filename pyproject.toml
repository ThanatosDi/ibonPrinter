[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibon-printer"
version = "0.2.0"
description = "CLI and HTTP API for uploading files to 7-11 ibon cloud print."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.31",
  "tzdata; sys_platform == 'win32'",
  "qrcode[pil]>=7,<9",
]

[project.scripts]
ibon-printer = "ibon_printer.cli:main"
ibon-printer-api = "ibon_printer.api:run"

[tool.hatch.build.targets.wheel]
packages = ["ibon_printer"]

[tool.hatch.build.targets.sdist]
include = ["ibon_printer", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "pyzbar>=0.1.9",
]
